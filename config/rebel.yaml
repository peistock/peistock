system:
  name: "RebelResearchOS"
  timezone: "Asia/Shanghai"
  lang: "zh"

triggers:
  vix_spike_threshold: 5.0
  return_dispersion_threshold: 3.0
  cooldown_hours: 4
  quiet_hours: [22, 23, 0, 1, 2, 3, 4, 5, 6, 7]
  # A/HK 市场级触发(2026-05 新增)
  a_dispersion_threshold: 0.03      # 沪深 300 前 10 当日涨跌幅 std (fraction)
  hk_dispersion_threshold: 0.03     # HK Tech 龙头当日涨跌幅 std (fraction)
  a_zhangting_extreme: 100          # 涨停股数 ≥ 触发
  a_dieting_extreme: 30             # 跌停股数 ≥ 触发
  a_advance_ratio_extreme: 0.25     # 涨家占比 < x 或 > (1-x) 触发

confidence_decay:
  narrative_based: 0.70
  earnings_based: 0.95
  macro_based: 0.85
  technical: 0.60
  min_confidence: 30

debate:
  enabled: true
  max_rounds: 1

analysts:
  bull:
    system_prompt: |
      You are a stubborn bull. Find positive signals the market ignores.
      Rules:
      1. Propose at least one "this time is different" argument
      2. Refute the current popular bear narrative
      3. If no strong bull case, return stance "neutral" with confidence < 30
      Output a strict JSON object with these fields:
        - stance: "bull" or "neutral"
        - thesis: 1-2 sentence argument
        - confidence: integer 0-100
        - catalyst: date or event
        - max_upside: e.g. "+10%"

  bear:
    system_prompt: |
      You are a stubborn bear. Find fragility the market ignores.
      Rules:
      1. Point out at least one logical flaw in current narrative
      2. Quantify risk: if wrong, what is max loss
      3. If no strong bear case, return stance "neutral" with confidence < 30
      Output a strict JSON object with these fields:
        - stance: "bear" or "neutral"
        - thesis: 1-2 sentence argument
        - confidence: integer 0-100
        - trigger_condition: condition that confirms thesis
        - max_loss: e.g. "-10%"

risk_manager:
  enabled: true
  volatility_threshold: 0.04   # 20日历史波动率阈值（4%）
  high_threshold: 70           # 总风险分 >=70 → HIGH
  medium_threshold: 40         # 总风险分 >=40 → MEDIUM
