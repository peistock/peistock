# SearXNG 聚合搜索 — 供 rebel_research LLM 工具调用
# 部署方式：
#   1. 把此文件和 searxng/settings.yml 上传到服务器 ~/rebel_research/
#   2. docker-compose -f docker-compose.searxng.yml up -d
#   3. 测试：curl http://localhost:8080/health

version: "3.8"

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
